spring.application.name=delivery-service

server.port=8094



# =========================
# MySQL
# =========================

spring.datasource.url=jdbc:mysql://localhost:3306/flipkart_delivery_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=Aryanv#02
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA
# =========================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================
# Eureka
# =========================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# =========================
# Actuator
# =========================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# =========================
# Tracing
# =========================

management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
