spring.application.name=notification-service

server.port=8096

# =========================
# Config Server
# =========================

spring.config.import=optional:configserver:http://localhost:8888

# =========================
# Eureka
# =========================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# =========================
# Kafka
# =========================

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=notification-group

spring.kafka.consumer.auto-offset-reset=latest

spring.kafka.consumer.enable-auto-commit=false

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.flipkart.notification.dto

spring.kafka.consumer.properties.spring.json.value.default.type=com.flipkart.notification.dto.OrderConfirmedEvent

# =========================
# Actuator
# =========================

management.endpoints.web.exposure.include=health,info,metrics,prometheus

management.endpoint.health.show-details=always

# =========================
# Zipkin
# =========================

management.tracing.enabled=true

management.tracing.sampling.probability=1.0

management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
