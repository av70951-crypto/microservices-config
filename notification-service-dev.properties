# ==========================================
# Application
# ==========================================

spring.application.name=notification-service

server.port=8084


# ==========================================
# Config Server
# ==========================================

spring.config.import=optional:configserver:http://localhost:8888


# ==========================================
# MySQL Database
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/flipkart_notification_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata

spring.datasource.username=root

spring.datasource.password=Aryanv#02

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==========================================
# JPA / Hibernate
# ==========================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true


# ==========================================
# Eureka Client
# ==========================================

eureka.client.register-with-eureka=true

eureka.client.fetch-registry=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.instance.prefer-ip-address=true


# ==========================================
# Kafka
# ==========================================

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=notification-group

spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.listener.observation-enabled=true


# ==========================================
# Actuator
# ==========================================

management.endpoints.web.exposure.include=*

management.endpoint.health.show-details=always

management.info.env.enabled=true


# ==========================================
# Distributed Tracing / Zipkin
# ==========================================

management.tracing.enabled=true

management.tracing.sampling.probability=1.0

management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans


# ==========================================
# Application Information
# ==========================================

info.application.name=Flipkart Notification Service

info.application.description=Flipkart Kafka Notification Microservice

info.application.version=1.0.0
